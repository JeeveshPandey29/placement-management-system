<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Drives — PMS 3.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <div id="app"></div>
  <script src="common.js"></script>
  <script>
  (async () => {
    const u = auth.getUser(); if (!u) return;
    const role = u.role;
    const createBtn = role==='admin' ? `<button class="btn btn-primary" id="create-drive-btn">${IC.plus} Create Drive</button>` : '';
    if (!initPage('drives', 'Placement Drives', 'Browse placement opportunities', createBtn)) return;
    try {
      const drives = await api('/drives');
      const myAppsBtn = role==='student' ? `<button class="btn btn-secondary" id="my-apps-btn">📋 My Applications</button>` : '';
      pb().innerHTML = `
        <div class="toolbar"><div class="toolbar-spacer"></div><span class="text-muted text-sm">${drives.length} drive(s)</span>${myAppsBtn}</div>
        <div class="drives-grid">
          ${drives.length===0?'<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🏢</div><h3>No placement drives yet</h3></div>':
          drives.map(d=>`<div class="drive-card">
            <div class="flex-between mb-1">
              <div class="drive-company">${d.company_name}</div>
              ${statusBadge(d.status)}
            </div>
            <div class="drive-role">${d.job_role}</div>
            <div class="drive-meta">
              <div class="drive-meta-item"><span>Package</span><div class="val">₹${d.package_lpa} LPA</div></div>
              <div class="drive-meta-item"><span>Min CGPA</span><div class="val">${d.eligibility_cgpa}</div></div>
              <div class="drive-meta-item"><span>Date</span><div class="val">${fmtDate(d.date)}</div></div>
            </div>
            <div class="btn-group">
              ${role==='student'?`<button class="btn btn-primary btn-sm apply-btn" data-id="${d.id}">Apply Now</button>`:''}
              ${role!=='student'?`<button class="btn btn-secondary btn-sm view-apps-btn" data-id="${d.id}" data-name="${d.company_name}">View Applications</button>`:''}
            </div>
          </div>`).join('')}
        </div>`;

      if (role==='student') {
        document.querySelectorAll('.apply-btn').forEach(btn => {
          btn.onclick = async () => {
            btn.disabled=true; btn.textContent='Applying…';
            try { await api(`/drives/${btn.dataset.id}/apply`,{method:'POST'}); toast('Applied successfully!','success'); btn.textContent='✓ Applied'; btn.classList.replace('btn-primary','btn-secondary'); }
            catch(e) { toast(e.message,'error'); btn.disabled=false; btn.textContent='Apply Now'; }
          };
        });
        document.getElementById('my-apps-btn')?.addEventListener('click', async () => {
          try {
            const apps = await api('/drives/my/applications');
            openModal(`<h2>My Applications</h2>
              <div class="table-wrapper"><table><thead><tr><th>Company</th><th>Role</th><th>Status</th></tr></thead><tbody>
              ${apps.length===0?'<tr><td colspan="3" class="text-center text-muted" style="padding:20px">No applications yet</td></tr>':
              apps.map(a=>`<tr><td><strong>${a.company_name}</strong></td><td>${a.job_role}</td><td>${statusBadge(a.status)}</td></tr>`).join('')}
              </tbody></table></div>
              <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
          } catch(e) { toast(e.message,'error'); }
        });
      }

      document.querySelectorAll('.view-apps-btn').forEach(btn => {
        btn.onclick = async () => {
          try {
            const apps = await api(`/drives/${btn.dataset.id}/applications`);
            openModal(`<h2>Applications — ${btn.dataset.name}</h2>
              <div class="table-wrapper"><table><thead><tr><th>Student</th><th>Status</th><th>Actions</th></tr></thead><tbody>
              ${apps.length===0?'<tr><td colspan="3" class="text-center text-muted" style="padding:20px">No applications</td></tr>':
              apps.map(a=>`<tr>
                <td><strong>${a.student_name||a.student_email}</strong></td>
                <td>${statusBadge(a.status)}</td>
                <td><div class="btn-group">
                  <select class="form-control btn-sm status-sel" data-appid="${a.id}" style="max-width:120px;padding:5px 8px">
                    <option value="applied" ${a.status==='applied'?'selected':''}>Applied</option>
                    <option value="shortlisted" ${a.status==='shortlisted'?'selected':''}>Shortlisted</option>
                    <option value="selected" ${a.status==='selected'?'selected':''}>Selected</option>
                    <option value="rejected" ${a.status==='rejected'?'selected':''}>Rejected</option>
                  </select>
                  <button class="btn btn-sm btn-primary upd-btn" data-appid="${a.id}">Update</button>
                </div></td>
              </tr>`).join('')}
              </tbody></table></div>
              <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`, true);

            document.querySelectorAll('.upd-btn').forEach(ub => {
              ub.onclick = async () => {
                const sv = document.querySelector(`.status-sel[data-appid="${ub.dataset.appid}"]`).value;
                try { await api(`/drives/applications/${ub.dataset.appid}/status?status_val=${sv}`,{method:'PUT'}); toast('Status updated!','success'); }
                catch(e) { toast(e.message,'error'); }
              };
            });
          } catch(e) { toast(e.message,'error'); }
        };
      });

      if (role==='admin') {
        document.getElementById('create-drive-btn').onclick = () => {
          openModal(`<h2>Create Placement Drive</h2>
            <div class="form-group"><label>Company Name</label><input class="form-control" id="d-co" placeholder="Google"></div>
            <div class="form-group"><label>Job Role</label><input class="form-control" id="d-role" placeholder="Software Engineer"></div>
            <div class="form-row">
              <div class="form-group"><label>Package (LPA)</label><input type="number" step="0.1" class="form-control" id="d-pkg"></div>
              <div class="form-group"><label>Min CGPA</label><input type="number" step="0.1" class="form-control" id="d-cgpa"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Date</label><input type="date" class="form-control" id="d-date"></div>
              <div class="form-group"><label>Status</label><select class="form-control" id="d-status"><option value="upcoming">Upcoming</option><option value="active">Active</option><option value="completed">Completed</option></select></div>
            </div>
            <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="d-save">Create</button></div>`);
          document.getElementById('d-save').onclick = async () => {
            const company_name=document.getElementById('d-co').value.trim(), job_role=document.getElementById('d-role').value.trim();
            const package_lpa=parseFloat(document.getElementById('d-pkg').value), eligibility_cgpa=parseFloat(document.getElementById('d-cgpa').value);
            const date=document.getElementById('d-date').value, status=document.getElementById('d-status').value;
            if(!company_name||!job_role||!date) return toast('Fill required fields','error');
            try { await api('/drives',{method:'POST',body:JSON.stringify({company_name,job_role,package_lpa,eligibility_cgpa,date,status})}); toast('Drive created!','success'); closeModal(); location.reload(); }
            catch(e){toast(e.message,'error');}
          };
        };
      }
    } catch(e){ pb().innerHTML=`<div class="empty-state"><h3>Error</h3><p>${e.message}</p></div>`; }
  })();
  </script>
</body>
</html>
