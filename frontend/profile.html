<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — PMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <div id="app"></div>
  <script src="common.js"></script>
  <script>
    (async () => {
      if (!initPage('profile', 'My Profile', 'View and update your student profile')) return;
      const user = auth.getUser();
      try {
        const p = await api('/students/profile');
        let colleges = [];
        try { colleges = await api('/colleges'); } catch(e) {}
        const ini = p.email[0].toUpperCase();
        pb().innerHTML = `
          <div class="profile-header">
            <div class="profile-avatar">${ini}</div>
            <div class="profile-meta">
              <h2>${p.email}</h2>
              <p>${p.college_name || 'No college assigned'} · ${p.branch || 'No branch'}</p>
              <div class="mt-1">${statusBadge(p.status)}</div>
            </div>
          </div>
          <div class="profile-grid">
            <div class="profile-field"><label>Roll Number</label><div class="value">${p.roll_number || '—'}</div></div>
            <div class="profile-field"><label>GPA</label><div class="value">${p.gpa || '—'}</div></div>
            <div class="profile-field"><label>College</label><div class="value">${p.college_name || '—'}</div></div>
            <div class="profile-field"><label>Branch</label><div class="value">${p.branch || '—'}</div></div>
            <div class="profile-field"><label>Skills</label><div class="value">${p.skills || '—'}</div></div>
            <div class="profile-field"><label>Resume URL</label><div class="value">${p.resume_url ? '<a href="'+p.resume_url+'" target="_blank" style="color:var(--accent-cyan)">View Resume</a>' : '—'}</div></div>
          </div>
          <div class="mt-3"><button class="btn btn-primary" id="edit-btn">✏️ Edit Profile</button></div>`;

        document.getElementById('edit-btn').onclick = () => {
          openModal(`
            <h2>Edit Profile</h2>
            <div class="form-group"><label>Roll Number</label><input class="form-control" id="e-roll" value="${p.roll_number||''}"></div>
            <div class="form-row">
              <div class="form-group"><label>College</label><select class="form-control" id="e-college">
                <option value="">Select College</option>
                ${colleges.map(c => `<option value="${c.id}" ${c.id===p.college_id?'selected':''}>${c.name}</option>`).join('')}
              </select></div>
              <div class="form-group"><label>Branch</label><input class="form-control" id="e-branch" value="${p.branch||''}"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>GPA</label><input class="form-control" id="e-gpa" type="number" step="0.01" min="0" max="10" value="${p.gpa||''}"></div>
              <div class="form-group"><label>Status</label><select class="form-control" id="e-status">
                <option value="unplaced" ${p.status==='unplaced'?'selected':''}>Unplaced</option>
                <option value="placed" ${p.status==='placed'?'selected':''}>Placed</option>
              </select></div>
            </div>
            <div class="form-group"><label>Skills</label><input class="form-control" id="e-skills" value="${p.skills||''}" placeholder="Python, Java, SQL..."></div>
            <div class="form-group"><label>Resume URL</label><input class="form-control" id="e-resume" value="${p.resume_url||''}" placeholder="https://..."></div>
            <div class="modal-actions">
              <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" id="save-btn">Save Changes</button>
            </div>
          `);
          document.getElementById('save-btn').onclick = async () => {
            const body = {};
            const roll = document.getElementById('e-roll').value.trim();
            const cid = document.getElementById('e-college').value;
            const branch = document.getElementById('e-branch').value.trim();
            const gpa = document.getElementById('e-gpa').value;
            const skills = document.getElementById('e-skills').value.trim();
            const resume = document.getElementById('e-resume').value.trim();
            const status = document.getElementById('e-status').value;
            if (roll) body.roll_number = roll;
            if (cid) body.college_id = parseInt(cid);
            if (branch) body.branch = branch;
            if (gpa) body.gpa = parseFloat(gpa);
            if (skills) body.skills = skills;
            if (resume) body.resume_url = resume;
            body.status = status;
            try {
              await api('/students/profile', { method: 'PUT', body: JSON.stringify(body) });
              toast('Profile updated!', 'success');
              closeModal();
              location.reload();
            } catch(e) { toast(e.message, 'error'); }
          };
        };
      } catch (e) {
        pb().innerHTML = `<div class="empty-state"><h3>Profile not found</h3><p>${e.message}</p><p class="mt-2 text-muted">Only student accounts have profiles.</p></div>`;
      }
    })();
  </script>
</body>
</html>
