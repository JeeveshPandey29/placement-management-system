<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colleges — PMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <div id="app"></div>
  <script src="common.js"></script>
  <script>
    (async () => {
      if (!initPage('colleges', 'Colleges', 'View and manage college information')) return;
      const role = auth.getUser().role;
      try {
        const data = await api('/colleges');
        const addBtn = role === 'admin' ? '<button class="btn btn-primary btn-sm" id="add-college-btn">+ Add College</button>' : '';
        pb().innerHTML = `
          <div class="toolbar"><div class="toolbar-spacer"></div><span class="text-muted text-sm">${data.length} college(s)</span>${addBtn}</div>
          <div class="stats-grid" id="college-grid">
            ${data.length === 0 ? '<div class="empty-state" style="grid-column:1/-1"><h3>No colleges yet</h3><p>Add a college to get started</p></div>' :
            data.map(c => `<div class="stat-card">
              <div class="stat-icon" style="background:rgba(124,58,237,0.15);color:var(--accent-purple)">🎓</div>
              <div class="stat-value text-sm">${c.name}</div>
              <div class="stat-label">${c.location}</div>
            </div>`).join('')}
          </div>`;

        if (role === 'admin') {
          document.getElementById('add-college-btn')?.addEventListener('click', () => {
            openModal(`<h2>Add College</h2>
              <div class="form-group"><label>College Name</label><input class="form-control" id="c-name" placeholder="e.g. IIT Delhi"></div>
              <div class="form-group"><label>Location</label><input class="form-control" id="c-loc" placeholder="e.g. New Delhi, India"></div>
              <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="c-save">Add College</button>
              </div>`);
            document.getElementById('c-save').onclick = async () => {
              const name = document.getElementById('c-name').value.trim();
              const location = document.getElementById('c-loc').value.trim();
              if (!name || !location) return toast('Fill all fields', 'error');
              try {
                await api('/colleges', { method: 'POST', body: JSON.stringify({ name, location }) });
                toast('College added!', 'success'); closeModal(); location.reload ? window.location.reload() : null;
              } catch(e) { toast(e.message, 'error'); }
            };
          });
        }
      } catch(e) { pb().innerHTML = `<div class="empty-state"><h3>Error</h3><p>${e.message}</p></div>`; }
    })();
  </script>
</body>
</html>
