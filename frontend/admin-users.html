<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — PMS 3.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <div id="app"></div>
  <script src="common.js"></script>
  <script>
  (async () => {
    const u = auth.getUser();
    if (!u || u.role !== 'admin') { location.href = 'dashboard.html'; return; }
    if (!initPage('admin-users', 'User Management', 'Create and manage all user accounts',
      `<button class="btn btn-secondary" id="bulk-btn">⬆ Bulk CSV Upload</button><button class="btn btn-primary" id="add-user-btn">${IC.plus} Add User</button>`)) return;

    async function loadUsers() {
      try {
        const users = await api('/admin/users');
        pb().innerHTML = `
          <div class="toolbar">
            <select class="form-control" id="role-filter">
              <option value="">All Roles</option>
              <option value="admin">Admin</option>
              <option value="trainer">Trainer</option>
              <option value="student">Student</option>
            </select>
            <span class="text-muted text-sm toolbar-spacer">${users.length} user(s)</span>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Password</th><th>Created</th><th>Actions</th></tr></thead>
              <tbody id="users-tbody">
                ${renderRows(users)}
              </tbody>
            </table>
          </div>`;

        document.getElementById('role-filter').onchange = async function() {
          const role = this.value;
          const filtered = role ? users.filter(u => u.role === role) : users;
          document.getElementById('users-tbody').innerHTML = renderRows(filtered);
          attachActions();
        };
        attachActions();
      } catch(e) {
        pb().innerHTML = `<div class="empty-state"><h3>Error</h3><p>${e.message}</p></div>`;
      }
    }

    function renderRows(users) {
      if (!users.length) return '<tr><td colspan="6" class="text-center text-muted" style="padding:30px">No users found</td></tr>';
      return users.map(u => `<tr>
        <td><strong>${u.full_name || '—'}</strong></td>
        <td>${u.email}</td>
        <td>${statusBadge(u.role)}</td>
        <td>${u.must_change_password ? '<span class="badge badge-orange">Pending</span>' : '<span class="badge badge-green">Set</span>'}</td>
        <td class="text-muted text-sm">${fmtDate(u.created_at)}</td>
        <td>
          <button class="btn btn-sm btn-danger del-user" data-id="${u.id}" data-name="${u.full_name||u.email}">${IC.trash}</button>
        </td>
      </tr>`).join('');
    }

    function attachActions() {
      document.querySelectorAll('.del-user').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm(`Delete user "${btn.dataset.name}"? This is permanent.`)) return;
          try {
            await api(`/admin/users/${btn.dataset.id}`, { method: 'DELETE' });
            toast('User deleted', 'success'); loadUsers();
          } catch(e) { toast(e.message, 'error'); }
        };
      });
    }

    document.getElementById('bulk-btn').onclick = () => {
      openModal(`<h2>Bulk Upload Students / Trainers</h2>
        <div class="card mb-2" style="background:#eff6ff;border-color:#bfdbfe;padding:12px">
          <p class="text-sm" style="color:#1d4ed8;font-weight:600">CSV Format (first row = headers):</p>
          <code style="font-size:0.75rem;color:#1e40af;display:block;margin-top:4px">full_name,email,role,enrollment_number,branch</code>
          <p class="text-sm mt-1" style="color:#3b82f6">• Student default password = enrollment_number</p>
          <p class="text-sm" style="color:#3b82f6">• Trainer default password = email prefix (before @)</p>
        </div>
        <div class="form-group">
          <label>Download Template</label>
          <a href="data:text/csv;charset=utf-8,full_name,email,role,enrollment_number,branch%0AKrish Gupta,krish@student.com,student,CSE2024001,Computer Science%0AVijay Trainer,vijay@pms.com,trainer,," 
             download="pms_upload_template.csv" class="btn btn-secondary btn-sm">⬇ Download CSV Template</a>
        </div>
        <div class="form-group">
          <label>Upload CSV File</label>
          <input type="file" class="form-control" id="csv-file" accept=".csv">
        </div>
        <div id="bulk-result" class="hidden"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="bulk-save">Upload</button>
        </div>`);

      document.getElementById('bulk-save').onclick = async () => {
        const fileInput = document.getElementById('csv-file');
        if (!fileInput.files[0]) return toast('Select a CSV file', 'error');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const btn = document.getElementById('bulk-save');
        btn.disabled = true; btn.textContent = 'Uploading…';
        try {
          const r = await fetch(API + '/admin/users/bulk', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + auth.getToken() },
            body: formData
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || 'Upload failed');
          const res = document.getElementById('bulk-result');
          res.classList.remove('hidden');
          res.innerHTML = `<div class="card" style="background:#f0fdf4;border-color:#bbf7d0;padding:12px">
            <p style="color:#15803d;font-weight:600">✅ Created: ${d.created} &nbsp;|&nbsp; Skipped: ${d.skipped_duplicates}</p>
            ${d.errors.length ? `<p class="text-sm mt-1" style="color:var(--red)">${d.errors.join('<br>')}</p>` : ''}
            <div class="mt-2" style="max-height:150px;overflow-y:auto">
              ${d.users.map(u => `<div class="text-sm" style="padding:2px 0">${u.full_name||u.email} — pw: <code>${u.default_password}</code></div>`).join('')}
            </div>
          </div>`;
          toast(`${d.created} user(s) created!`, 'success');
          loadUsers();
        } catch(e) { toast(e.message, 'error'); }
        btn.disabled = false; btn.textContent = 'Upload';
      };
    };

    document.getElementById('add-user-btn').onclick = () => {
      openModal(`<h2>Add New User</h2>
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input class="form-control" id="nu-name" placeholder="John Doe"></div>
          <div class="form-group"><label>Email</label><input type="email" class="form-control" id="nu-email" placeholder="john@mitadt.edu.in"></div>
        </div>
        <div class="form-group"><label>Role</label>
          <select class="form-control" id="nu-role">
            <option value="student">Student</option>
            <option value="trainer">Trainer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div id="student-extras">
          <div class="form-row">
            <div class="form-group"><label>Enrollment Number</label><input class="form-control" id="nu-enroll" placeholder="MIT2024001"></div>
            <div class="form-group"><label>Branch</label><input class="form-control" id="nu-branch" placeholder="Computer Science"></div>
          </div>
        </div>
        <div class="card mt-1" style="background:#eff6ff;border-color:#bfdbfe;padding:12px">
          <p class="text-sm" style="color:#1d4ed8">Default password = first name (lowercase). User must change it on first login.</p>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="nu-save">Create User</button>
        </div>`);

      document.getElementById('nu-role').onchange = function() {
        document.getElementById('student-extras').classList.toggle('hidden', this.value !== 'student');
      };

      document.getElementById('nu-save').onclick = async () => {
        const full_name = document.getElementById('nu-name').value.trim();
        const email = document.getElementById('nu-email').value.trim();
        const role = document.getElementById('nu-role').value;
        const enrollment_number = document.getElementById('nu-enroll')?.value.trim() || null;
        const branch = document.getElementById('nu-branch')?.value.trim() || null;
        if (!full_name || !email) return toast('Name and email required', 'error');
        try {
          await api('/admin/users', { method: 'POST', body: JSON.stringify({ full_name, email, role, enrollment_number, branch }) });
          toast(`${role} account created! Default password: ${full_name.split(' ')[0].toLowerCase()}`, 'success');
          closeModal(); loadUsers();
        } catch(e) { toast(e.message, 'error'); }
      };
    };

    await loadUsers();
  })();
  </script>
</body>
</html>
