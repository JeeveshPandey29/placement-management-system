<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password — PMS 3.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div id="app">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-icon">P</div>
          <div class="logo-text">PMS 3.0 <span>First Login Setup</span></div>
        </div>
        <h1>Set your password</h1>
        <p class="subtitle">Your account was created by admin. Please set a new password to continue.</p>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="np" class="form-control" placeholder="Min 6 characters">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="cp" class="form-control" placeholder="Repeat password">
        </div>
        <button class="btn btn-primary btn-block" id="set-btn">Set Password & Continue</button>
      </div>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    if (!auth.getToken()) { location.href = 'login.html'; }
    document.getElementById('set-btn').onclick = async () => {
      const np = document.getElementById('np').value;
      const cp = document.getElementById('cp').value;
      if (!np || np.length < 6) return toast('Password must be at least 6 characters', 'error');
      if (np !== cp) return toast('Passwords do not match', 'error');
      const btn = document.getElementById('set-btn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await api('/set-password', { method: 'POST', body: JSON.stringify({ new_password: np }) });
        const u = auth.getUser();
        if (u) { u.must_change_password = false; auth.save(auth.getToken(), u); }
        toast('Password set! Redirecting…', 'success');
        setTimeout(() => location.href = 'dashboard.html', 1000);
      } catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Set Password & Continue'; }
    };
  </script>
</body>
</html>
