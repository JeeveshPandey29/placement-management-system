<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PMS 3.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <div id="app"></div>
  <script src="common.js"></script>
  <script>
  (async () => {
    if (!initPage('dashboard', 'Dashboard', 'Welcome to your placement portal')) return;
    const user = auth.getUser();
    const r = user.role;
    try {
      if (r === 'admin' || r === 'trainer') {
        const [a, notifs] = await Promise.all([
          api('/analytics'),
          api('/notifications').catch(() => [])
        ]);
        pb().innerHTML = `
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:#3b82f6">${IC.users}</div><div class="stat-value">${a.total_students}</div><div class="stat-label">Total Students</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4;color:#10b981">${IC.user}</div><div class="stat-value">${a.placed_students}</div><div class="stat-label">Placed</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:#3b82f6">${IC.chart}</div><div class="stat-value">${a.placement_percentage.toFixed(1)}%</div><div class="stat-label">Placement Rate</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#fef3c7;color:#f59e0b">${IC.doc}</div><div class="stat-value">${a.average_gpa.toFixed(2)}</div><div class="stat-label">Avg GPA</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#ede9fe;color:#8b5cf6">${IC.brief}</div><div class="stat-value">${a.total_drives}</div><div class="stat-label">Drives</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4;color:#10b981">${IC.batch}</div><div class="stat-value">${a.total_batches}</div><div class="stat-label">Batches</div></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px" class="responsive-grid">
            <div class="card">
              <div class="card-header"><h3>Quick Actions</h3></div>
              <div class="btn-group" style="flex-direction:column;align-items:flex-start">
                <a href="students.html" class="btn btn-secondary w-full" style="justify-content:flex-start">${IC.users} View Students</a>
                <a href="batches.html" class="btn btn-secondary w-full" style="justify-content:flex-start">${IC.batch} Manage Batches</a>
                <a href="notifications.html" class="btn btn-secondary w-full" style="justify-content:flex-start">${IC.bell} Send Notification</a>
                <a href="attendance.html" class="btn btn-secondary w-full" style="justify-content:flex-start">${IC.cal} Record Attendance</a>
                <a href="analytics.html" class="btn btn-secondary w-full" style="justify-content:flex-start">${IC.chart} View Analytics</a>
              </div>
            </div>
            <div class="card">
              <div class="card-header"><h3>Recent Notifications</h3><a href="notifications.html" class="btn btn-sm btn-secondary">View All</a></div>
              <div class="notif-list">
                ${notifs.slice(0,4).map(n => `
                  <div class="notif-card">
                    <div class="notif-body">
                      <div class="notif-title">${n.title}</div>
                      <div class="notif-msg">${n.message.substring(0,80)}${n.message.length>80?'…':''}</div>
                      <div class="notif-meta">${timeAgo(n.created_at)} · ${n.target_type}</div>
                    </div>
                  </div>`).join('') || '<p class="text-muted text-sm">No notifications yet</p>'}
              </div>
            </div>
          </div>`;
      } else {
        // Student dashboard
        const [profile, notifs, classes, drives] = await Promise.all([
          api('/students/profile').catch(() => null),
          api('/notifications/my').catch(() => []),
          api('/classes').catch(() => []),
          api('/drives').catch(() => [])
        ]);
        const unread = notifs.filter(n => !n.is_read).length;
        pb().innerHTML = `
          ${!profile ? `<div class="card mb-3" style="border-color:#fbbf24;background:#fffbeb"><p style="color:#b45309">⚠️ Complete your profile to get started. <a href="profile.html" style="color:var(--blue)">Go to Profile →</a></p></div>` : ''}
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:#3b82f6">${IC.doc}</div><div class="stat-value">${profile?.gpa || '—'}</div><div class="stat-label">Your GPA</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:${profile?.status==='placed'?'#f0fdf4':'#fef3c7'};color:${profile?.status==='placed'?'#10b981':'#f59e0b'}">${IC.user}</div><div class="stat-value text-sm">${profile?.status || 'unplaced'}</div><div class="stat-label">Status</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:#3b82f6">${IC.bell}</div><div class="stat-value">${unread}</div><div class="stat-label">Unread Notifications</div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#ede9fe;color:#8b5cf6">${IC.class_}</div><div class="stat-value">${classes.length}</div><div class="stat-label">Upcoming Classes</div></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px" class="responsive-grid">
            <div class="card">
              <div class="card-header"><h3>Notifications</h3><a href="notifications.html" class="btn btn-sm btn-secondary">View All</a></div>
              <div class="notif-list">
                ${notifs.slice(0,4).map(n => `
                  <div class="notif-card ${!n.is_read?'unread':''}">
                    ${!n.is_read ? '<div class="notif-dot"></div>' : ''}
                    <div class="notif-body">
                      <div class="notif-title">${n.title}</div>
                      <div class="notif-msg">${n.message.substring(0,70)}${n.message.length>70?'…':''}</div>
                      <div class="notif-meta">${timeAgo(n.created_at)}</div>
                    </div>
                  </div>`).join('') || '<p class="text-muted text-sm">No notifications</p>'}
              </div>
            </div>
            <div class="card">
              <div class="card-header"><h3>Upcoming Classes</h3><a href="classes.html" class="btn btn-sm btn-secondary">View All</a></div>
              ${classes.slice(0,4).map(c => `
                <div style="padding:10px 0;border-bottom:1px solid var(--border)">
                  <div style="font-weight:600;font-size:0.88rem">${c.title}</div>
                  <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:2px">${c.batch_name} · ${fmtDate(c.class_date)} ${c.start_time||''}</div>
                  ${c.location ? `<div style="font-size:0.75rem;color:var(--text-muted)">${c.location}</div>` : ''}
                </div>`).join('') || '<p class="text-muted text-sm">No classes scheduled</p>'}
            </div>
          </div>`;
      }
    } catch (e) {
      pb().innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Error loading dashboard</h3><p>${e.message}</p></div>`;
    }
  })();
  </script>
  <style>.responsive-grid{grid-template-columns:1fr 1fr}@media(max-width:768px){.responsive-grid{grid-template-columns:1fr!important}}</style>
</body>
</html>
