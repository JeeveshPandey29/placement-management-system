<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance — PMS 3.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <div id="app"></div>
  <script src="common.js"></script>
  <script>
  (async () => {
    if (!initPage('attendance', 'Attendance', 'Track student attendance')) return;
    const role = auth.getUser().role;

    if (role === 'student') {
      // ── Student: view own attendance ──────────────────────────────────────
      const data = await api('/attendance/my').catch(() => []);
      const present = data.filter(a => a.status === 'present').length;
      const pct = data.length > 0 ? ((present / data.length) * 100).toFixed(1) : 0;
      pb().innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4;color:#10b981">${IC.cal}</div><div class="stat-value">${present}</div><div class="stat-label">Present</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#fef2f2;color:#ef4444">${IC.cal}</div><div class="stat-value">${data.filter(a=>a.status==='absent').length}</div><div class="stat-label">Absent</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#fef3c7;color:#f59e0b">${IC.cal}</div><div class="stat-value">${data.filter(a=>a.status==='late').length}</div><div class="stat-label">Late</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:#3b82f6">${IC.chart}</div><div class="stat-value">${pct}%</div><div class="stat-label">Rate</div></div>
        </div>
        <div class="table-wrapper"><table>
          <thead><tr><th>Date</th><th>Session</th><th>Status</th></tr></thead>
          <tbody>${data.length === 0
            ? '<tr><td colspan="3" class="text-center text-muted" style="padding:30px">No records</td></tr>'
            : data.map(a => `<tr><td>${fmtDate(a.date)}</td><td>${a.session_name}</td><td>${statusBadge(a.status)}</td></tr>`).join('')}
          </tbody>
        </table></div>`;
      return;
    }

    // ── Trainer/Admin: batch-based attendance ─────────────────────────────────
    const batches = await api('/batches').catch(() => []);

    pb().innerHTML = `
      <div class="tabs">
        <button class="tab-btn active" data-tab="mark">Mark Attendance</button>
        <button class="tab-btn" data-tab="view">View Records</button>
      </div>

      <!-- Mark Attendance Tab -->
      <div id="tab-mark">
        <div class="card" style="max-width:700px">
          <h3 style="margin-bottom:16px">Mark Batch Attendance</h3>
          <div class="form-row">
            <div class="form-group">
              <label>Select Batch</label>
              <select class="form-control" id="m-batch">
                <option value="">— Select batch —</option>
                ${batches.map(b => `<option value="${b.id}">${b.name}${b.branch?' — '+b.branch:''}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" class="form-control" id="m-date" value="${new Date().toISOString().split('T')[0]}">
            </div>
          </div>
          <div class="form-group">
            <label>Session Name</label>
            <input class="form-control" id="m-session" placeholder="e.g. Python Basics — Day 3">
          </div>
          <button class="btn btn-secondary" id="load-students-btn">Load Students</button>
          <div id="student-checklist" class="mt-3 hidden">
            <div class="flex-between mb-2">
              <strong class="text-sm" id="checklist-label"></strong>
              <div class="btn-group">
                <button class="btn btn-sm btn-secondary" id="mark-all-present">All Present</button>
                <button class="btn btn-sm btn-secondary" id="mark-all-absent">All Absent</button>
              </div>
            </div>
            <div class="table-wrapper">
              <table>
                <thead><tr><th>Student</th><th>Enrollment</th><th>Present</th><th>Absent</th><th>Late</th></tr></thead>
                <tbody id="attendance-rows"></tbody>
              </table>
            </div>
            <div class="mt-2">
              <button class="btn btn-primary" id="submit-attendance-btn">Submit Attendance</button>
            </div>
          </div>
        </div>
      </div>

      <!-- View Records Tab -->
      <div id="tab-view" class="hidden">
        <div class="toolbar">
          <select class="form-control" id="v-batch">
            <option value="">All Batches</option>
            ${batches.map(b => `<option value="${b.id}">${b.name}</option>`).join('')}
          </select>
          <button class="btn btn-primary btn-sm" id="v-filter">Filter</button>
        </div>
        <div class="table-wrapper"><table>
          <thead><tr><th>Student</th><th>Date</th><th>Session</th><th>Status</th><th></th></tr></thead>
          <tbody id="view-tbody"><tr><td colspan="5" class="text-center text-muted" style="padding:24px">Select a batch and click Filter</td></tr></tbody>
        </table></div>
      </div>`;

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-mark').classList.toggle('hidden', btn.dataset.tab !== 'mark');
        document.getElementById('tab-view').classList.toggle('hidden', btn.dataset.tab !== 'view');
      };
    });

    let loadedStudents = [];

    // Load students for selected batch
    document.getElementById('load-students-btn').onclick = async () => {
      const bid = document.getElementById('m-batch').value;
      if (!bid) return toast('Select a batch first', 'error');
      try {
        loadedStudents = await api(`/batches/${bid}/students`);
        if (loadedStudents.length === 0) {
          toast('No students in this batch', 'info'); return;
        }
        const batchName = batches.find(b => b.id == bid)?.name || '';
        document.getElementById('checklist-label').textContent = `${loadedStudents.length} students in ${batchName}`;
        document.getElementById('attendance-rows').innerHTML = loadedStudents.map(s => `
          <tr data-sid="${s.id}">
            <td><strong>${s.full_name || s.email}</strong><br><span class="text-muted text-sm">${s.email}</span></td>
            <td>${s.enrollment_number || '—'}</td>
            <td><input type="radio" name="att_${s.id}" value="present" checked></td>
            <td><input type="radio" name="att_${s.id}" value="absent"></td>
            <td><input type="radio" name="att_${s.id}" value="late"></td>
          </tr>`).join('');
        document.getElementById('student-checklist').classList.remove('hidden');
      } catch(e) { toast(e.message, 'error'); }
    };

    document.getElementById('mark-all-present').onclick = () => {
      loadedStudents.forEach(s => {
        const r = document.querySelector(`input[name="att_${s.id}"][value="present"]`);
        if (r) r.checked = true;
      });
    };
    document.getElementById('mark-all-absent').onclick = () => {
      loadedStudents.forEach(s => {
        const r = document.querySelector(`input[name="att_${s.id}"][value="absent"]`);
        if (r) r.checked = true;
      });
    };

    // Submit bulk attendance
    document.getElementById('submit-attendance-btn').onclick = async () => {
      const batch_id = parseInt(document.getElementById('m-batch').value);
      const date = document.getElementById('m-date').value;
      const session_name = document.getElementById('m-session').value.trim();
      if (!date || !session_name) return toast('Fill date and session name', 'error');

      const records = loadedStudents.map(s => {
        const checked = document.querySelector(`input[name="att_${s.id}"]:checked`);
        return { student_id: s.id, status: checked ? checked.value : 'absent' };
      });

      const btn = document.getElementById('submit-attendance-btn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const res = await api('/attendance/bulk', {
          method: 'POST',
          body: JSON.stringify({ batch_id, date, session_name, records })
        });
        toast(res.message, 'success');
        document.getElementById('student-checklist').classList.add('hidden');
        document.getElementById('m-session').value = '';
        loadedStudents = [];
      } catch(e) { toast(e.message, 'error'); }
      btn.disabled = false; btn.textContent = 'Submit Attendance';
    };

    // View records
    document.getElementById('v-filter').onclick = async () => {
      const bid = document.getElementById('v-batch').value;
      let url = '/attendance?';
      if (bid) url += 'batch_id=' + bid;
      try {
        const data = await api(url);
        document.getElementById('view-tbody').innerHTML = data.length === 0
          ? '<tr><td colspan="5" class="text-center text-muted" style="padding:24px">No records found</td></tr>'
          : data.map(a => `<tr>
              <td><strong>${a.student_name || a.student_email}</strong></td>
              <td>${fmtDate(a.date)}</td>
              <td>${a.session_name}</td>
              <td>${statusBadge(a.status)}</td>
              <td><button class="btn btn-sm btn-danger del-att" data-id="${a.id}">${IC.trash}</button></td>
            </tr>`).join('');

        document.querySelectorAll('.del-att').forEach(btn => {
          btn.onclick = async () => {
            try {
              await api(`/attendance/${btn.dataset.id}`, { method: 'DELETE' });
              toast('Deleted', 'success');
              btn.closest('tr').remove();
            } catch(e) { toast(e.message, 'error'); }
          };
        });
      } catch(e) { toast(e.message, 'error'); }
    };
  })();
  </script>
</body>
</html>
