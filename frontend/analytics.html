<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — PMS 3.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div id="app"></div>
  <script src="common.js"></script>
  <script>
  (async () => {
    if (!initPage('analytics', 'Analytics', 'Placement statistics and insights')) return;
    try {
      const a = await api('/analytics');
      const unplaced = a.total_students - a.placed_students;
      pb().innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:#3b82f6">👥</div><div class="stat-value">${a.total_students}</div><div class="stat-label">Total Students</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4;color:#10b981">✅</div><div class="stat-value">${a.placed_students}</div><div class="stat-label">Placed</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#fef3c7;color:#f59e0b">⏳</div><div class="stat-value">${unplaced}</div><div class="stat-label">Unplaced</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:#3b82f6">📊</div><div class="stat-value">${a.placement_percentage.toFixed(1)}%</div><div class="stat-label">Placement Rate</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#fef3c7;color:#f59e0b">🎓</div><div class="stat-value">${a.average_gpa.toFixed(2)}</div><div class="stat-label">Avg GPA</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#ede9fe;color:#8b5cf6">🏢</div><div class="stat-value">${a.total_drives}</div><div class="stat-label">Drives</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4;color:#10b981">📦</div><div class="stat-value">${a.total_batches}</div><div class="stat-label">Batches</div></div>
        </div>
        <div class="charts-grid">
          <div class="chart-card"><h3>Placement Status</h3><canvas id="c1" height="240"></canvas></div>
          <div class="chart-card"><h3>Overview</h3><canvas id="c2" height="240"></canvas></div>
        </div>`;

      const c1 = document.getElementById('c1');
      const ctx1 = c1.getContext('2d');
      c1.width = c1.parentElement.clientWidth - 44;
      drawDonut(ctx1, c1.width/2, 120, 80, [
        {value:a.placed_students,color:'#10b981',label:'Placed'},
        {value:unplaced,color:'#f59e0b',label:'Unplaced'}
      ]);

      const c2 = document.getElementById('c2');
      const ctx2 = c2.getContext('2d');
      c2.width = c2.parentElement.clientWidth - 44;
      drawBars(ctx2, c2.width, 240, [
        {label:'Students',value:a.total_students,color:'#3b82f6'},
        {label:'Placed',value:a.placed_students,color:'#10b981'},
        {label:'Drives',value:a.total_drives,color:'#8b5cf6'},
        {label:'Batches',value:a.total_batches,color:'#f59e0b'}
      ]);
    } catch(e) { pb().innerHTML = `<div class="empty-state"><h3>Error</h3><p>${e.message}</p></div>`; }
  })();

  function drawDonut(ctx, cx, cy, r, segs) {
    const total = segs.reduce((a,s)=>a+s.value,0);
    if (!total) return;
    let start = -Math.PI/2;
    segs.forEach(s => {
      const angle = (s.value/total)*Math.PI*2;
      ctx.beginPath(); ctx.arc(cx,cy,r,start,start+angle); ctx.arc(cx,cy,r*0.55,start+angle,start,true);
      ctx.closePath(); ctx.fillStyle=s.color; ctx.fill();
      const mid=start+angle/2, lx=cx+Math.cos(mid)*(r+26), ly=cy+Math.sin(mid)*(r+26);
      ctx.fillStyle='#1e293b'; ctx.font='600 12px Inter,sans-serif'; ctx.textAlign='center';
      ctx.fillText(`${s.label}: ${s.value}`,lx,ly);
      start+=angle;
    });
    ctx.fillStyle='#1e293b'; ctx.font='800 24px Inter,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(total?((segs[0].value/total)*100).toFixed(0)+'%':'0%',cx,cy-5);
    ctx.font='400 11px Inter,sans-serif'; ctx.fillStyle='#64748b'; ctx.fillText('Placed',cx,cy+14);
  }

  function drawBars(ctx, w, h, bars) {
    const max = Math.max(...bars.map(b=>b.value),1);
    const bw = Math.min(55,(w-80)/bars.length-16);
    const base=h-36, ch=h-64, sx=(w-bars.length*(bw+18))/2;
    bars.forEach((b,i)=>{
      const x=sx+i*(bw+18), bh=(b.value/max)*ch;
      ctx.fillStyle=b.color;
      if(ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x,base-bh,bw,bh,[5,5,0,0]); ctx.fill(); }
      else { ctx.fillRect(x,base-bh,bw,bh); }
      ctx.fillStyle='#1e293b'; ctx.font='700 13px Inter,sans-serif'; ctx.textAlign='center';
      ctx.fillText(b.value,x+bw/2,base-bh-8);
      ctx.fillStyle='#64748b'; ctx.font='500 11px Inter,sans-serif';
      ctx.fillText(b.label,x+bw/2,base+18);
    });
  }
  </script>
</body>
</html>
